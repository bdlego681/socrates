<main class="public-page">
  <section class="auth-card">
    <a routerLink="/login" class="brand">← Back to login</a>
    <h1>Verify your identity</h1>
    <p class="muted">Enter the code from your authenticator app.</p>
    <div class="mfa-actions">
      <label>{{ recovery() ? 'Recovery code' : '6-digit code' }}
        <input [formControl]="code" inputmode="numeric" maxlength="32" autocomplete="one-time-code" [placeholder]="recovery() ? 'XXXXXXXX-XXXXXXXX' : '123456'" autofocus />
      </label>
      @if (error()) { <p class="form-error">{{ error() }}</p> }
      <button type="button" class="button wide" (click)="submit()" [disabled]="code.invalid || loading()">
        {{ loading() ? 'Verifying…' : 'Verify' }}
      </button>
      <div class="mfa-divider" aria-hidden="true">or</div>
      <button type="button" class="button wide" (click)="recovery.set(!recovery())">
        {{ recovery() ? 'Use authenticator code' : 'Use a recovery code' }}
      </button>
    </div>
  </section>
</main>
